[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybuild-deps"
version = "0.5.0"
description = "A simple tool for detection of PEP-517 build dependencies."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "click>=8.0.1,<9",
    "tomli; python_version < '3.11'",
    "xdg>=6,<7",
    "requests>=2.32.3,<3",
    "packaging>=21.0",
    "pip-tools>=7,<7.6.2",
    "gitpython",
]

[[project.authors]]
name = "Bruno Ciconelle"
email = "bciconel@redhat.com"

[[project.maintainers]]
name = "Hermeto team"

[project.scripts]
pybuild-deps = "pybuild_deps.__main__:cli"

[project.urls]
Homepage = "https://github.com/hermetoproject/pybuild-deps"
Repository = "https://github.com/hermetoproject/pybuild-deps"
Documentation = "https://pybuild-deps.readthedocs.io"
Changelog = "https://github.com/hermetoproject/pybuild-deps/releases"
Issues = "https://github.com/hermetoproject/pybuild-deps/issues"
Discussions = "https://github.com/hermetoproject/pybuild-deps/discussions"

[dependency-groups]
dev = [
    "nox",
    "pre-commit>=2.16.0",
    "pre-commit-hooks>=4.1.0",
    "pydoclint>=0.4.1,<1",
    "pytest>=8.2.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10,<4",
    "pytest-xdist>=3.0",
    "ruff>=0.4.6",
    {include-group = "docs"},
]
docs = [
    "furo>=2021.11.12",
    "myst-parser>=0.16.1",
    "sphinx>=4.3.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-click>=3.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pybuild_deps"]
# The pip submodule contains the full pip repo (tests, docs, vendored deps).
# Exclude everything first, then force-include only src/pip/ which is the
# actual pip package we need. The sdist uses the same approach.
exclude = ["src/pybuild_deps/modules/pip/"]

[tool.hatch.build.targets.wheel.force-include]
"src/pybuild_deps/modules/pip/src/pip" = "pybuild_deps/modules/pip/src/pip"

[tool.hatch.build.targets.sdist]
exclude = [".venv/", ".nox/", "src/pybuild_deps/modules/pip/"]

[tool.hatch.build.targets.sdist.force-include]
"src/pybuild_deps/modules/pip/src/pip" = "src/pybuild_deps/modules/pip/src/pip"

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["src/pybuild_deps/modules"]

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "Q",   # flake8-quotes
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit
    "UP",  # pyupgrade
    "W",   # pycodestyle
]
# ignore checks that conflict with ruff formatter (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
extend-ignore = [
    "COM812",
    "COM819",
    "D105",
    "D107",
    "D107", # undocumented-public-init conflicts with DOC301
    "D203",
    "D206",
    "D212",
    "D300",
    "E111",
    "E114",
    "E117",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/test_*.py" = ["S101"]
"noxfile.py" = ["S101"]
"**/conftest.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = 'google'
exclude = '\.git|\.nox|modules'
arg-type-hints-in-docstring = false

[tool.pytest.ini_options]
markers = [
    "e2e: end to end tests (require network access).",
]
norecursedirs = ["src/pybuild_deps/modules"]
tmp_path_retention_count = 1
