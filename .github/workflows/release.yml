name: Release

on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pybuild-deps
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write # Required for pushing tags - https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#permissions
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> $GITHUB_OUTPUT

      - name: Check version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        run: |
          echo "version=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Tag new version if it doesn't exist
        id: tag-version
        if: steps.check-version.outputs.version
        env:
          TAG: ${{ steps.check-version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists, skipping."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version for developmental release
        if: "! steps.tag-version.outputs.tag"
        run: |
          uv version --bump patch --frozen &&
          version=$(uv version --short) &&
          uv version "${version}.dev$(date +%s)" --frozen

      - name: Build package
        run: |
          uv build

      - name: Publish package on PyPI
        if: steps.tag-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@v1.14.2

      - name: Publish package on TestPyPI
        if: "! steps.tag-version.outputs.tag"
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.7.0
        with:
          publish: ${{ steps.tag-version.outputs.tag != '' }}
          tag: ${{ steps.tag-version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
